[build]
  command = "npm run build:netlify"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  node_bundler = "esbuild"

# Asset hashati dal build di Next.js: il nome cambia a ogni modifica.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Immagini in public/: non tutti i nomi sono versionati (-v1, -v2...) e alcuni
# file vengono rigenerati sul posto, quindi cache di un giorno con rivalidazione
# in background invece di "immutable".
[[headers]]
  for = "/games/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/famiglio/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/codex/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/atlas/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
